name: Temporary backup-first branch cleanup
on:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: backup-first-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository_owner == 'abrahamahn' && github.repository != 'abrahamahn/ganbate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve and remove only branches contained in main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo.startswith('abrahamahn/') and repo != 'abrahamahn/ganbate'
          token = os.environ['GH_TOKEN']
          def api(path):
              req = urllib.request.Request('https://api.github.com/' + path,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          metadata = api('repos/' + repo)
          branches = []
          page = 1
          while True:
              batch = api('repos/' + repo + '/branches?per_page=100&page=' + str(page))
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          if not any(b['name'] == 'main' for b in branches):
              raise SystemExit('No main branch: no branches changed.')
          subprocess.run(['gh', 'auth', 'setup-git'], check=True)
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'branch-cleanup'
          subprocess.run(['git', 'clone', '--quiet', '--no-checkout',
                          'https://github.com/' + repo + '.git', str(work)], check=True)
          def git(*args, check=True):
              return subprocess.run(['git', '-C', str(work), *args],
                                    check=check, text=True, capture_output=True)
          outcomes = []
          for b in branches:
              name, sha = b['name'], b['commit']['sha']
              item = {'branch': name, 'sha': sha}
              if name == 'main' or name == metadata['default_branch'] or b.get('protected'):
                  item['status'] = 'retained-main-default-or-protected'
              else:
                  git('fetch', '--quiet', 'origin', '+refs/heads/main:refs/remotes/origin/main')
                  contained = git('merge-base', '--is-ancestor', sha, 'refs/remotes/origin/main', check=False)
                  if contained.returncode == 1:
                      item['status'] = 'retained-unmerged'
                  elif contained.returncode != 0:
                      item['status'] = 'retained-verification-error'
                  else:
                      tag = 'branch-cleanup-20260920-' + os.environ['GITHUB_RUN_ID'] + '/' + name
                      result = git('push', '--atomic',
                          '--force-with-lease=refs/heads/' + name + ':' + sha,
                          'origin', sha + ':refs/tags/' + tag, ':refs/heads/' + name, check=False)
                      item['status'] = 'archived-and-deleted' if result.returncode == 0 else 'retained-push-rejected'
                      if result.returncode == 0:
                          item['backup_tag'] = tag
                      else:
                          item['detail'] = result.stderr[-2000:]
              outcomes.append(item)
              print(json.dumps(item), flush=True)
          remaining = []
          page = 1
          while True:
              batch = api('repos/' + repo + '/branches?per_page=100&page=' + str(page))
              remaining.extend(b['name'] for b in batch)
              if len(batch) < 100:
                  break
              page += 1
          report = {'repository': repo, 'default_branch': metadata['default_branch'],
                    'outcomes': outcomes, 'remaining_branches': remaining}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Backup-first branch cleanup\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          print(json.dumps(report, indent=2))
          PY
