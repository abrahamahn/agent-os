name: Temporary checked branch consolidation
on:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: backup-first-branch-cleanup
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository_owner == 'abrahamahn' && github.repository != 'abrahamahn/ganbate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consolidate safe updates and preserve unresolved branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/abrahamahn/agent-os/c2210aafed6de434defe4fef5a65fb43687f13db/.github/maintenance/consolidate_branches_20260920.py -o "$RUNNER_TEMP/consolidate.py"
          python3 "$RUNNER_TEMP/consolidate.py"
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-consolidation-report
          path: ${{ runner.temp }}/branch-consolidation-report/
          retention-days: 1
          if-no-files-found: error
