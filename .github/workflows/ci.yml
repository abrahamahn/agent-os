name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install validation sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
